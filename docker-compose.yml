version: '3.8'
services:
  mysql:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: admin123456
      MYSQL_DATABASE: SmartCharging
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - mysql
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Port=3306;Database=SmartCharging;User=root;Password=admin123456;

volumes:
  mysql_data:
